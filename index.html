<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6df6">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes heures – Van Haecke</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#151a26;--mu:#7b8496;--ac:#2f6df6;--ac2:#6f93ff;--bd:#edf0f6;--sh:0 8px 28px rgba(30,45,90,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px;-webkit-font-smoothing:antialiased}
main{padding:22px 18px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 2px 18px}
h2,.lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:600;margin:0 0 10px}
h3{font-size:14px;margin:16px 0 6px}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
input,select{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--ac)}
button{padding:15px;font-size:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;width:100%;margin-top:18px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.mu,.sub{color:var(--mu);font-size:13px}
.sub{font-size:14px;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hi{margin:8px 2px 20px}.hn{font-size:27px;font-weight:700;letter-spacing:-.02em}
.hero{text-align:center;margin:20px 0 24px}.logo{font-size:46px}
.hero2{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.hero2 .lab,.hero2 .sub,.hero2 .mu{color:rgba(255,255,255,.8)}
.hero2 .row{border-color:rgba(255,255,255,.22)}.hero2 summary{color:#fff}
details{margin-top:6px}
summary{cursor:pointer;color:var(--ac);font-size:14px;font-weight:600;list-style:none;margin-top:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}details[open] summary::after{content:" ▴"}
.sec{margin-top:6px}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:0 10px 34px rgba(20,30,60,.16);padding:6px;max-width:532px;margin:auto}
nav a{flex:1;text-align:center;padding:9px 2px;font-size:12px;color:var(--mu);text-decoration:none;border-radius:20px}
nav a .ic{display:block;font-size:20px;line-height:1.2}
nav a.on{color:var(--ac);font-weight:700;background:var(--bg)}
.x{color:#e5484d;cursor:pointer;margin-left:8px}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 18px}.dots i{width:28px;height:6px;border-radius:3px;background:var(--bd)}.dots i.on{background:var(--ac)}
</style>
<script>
setTimeout(function(){var a=document.getElementById("app");if(a&&!a.innerHTML.trim()){document.body.innerHTML='<div style="font:16px system-ui;padding:28px;text-align:center"><h2>Un problème est survenu</h2><p>L’appli n’a pas pu démarrer. Tes données ne sont pas effacées.</p><button id="fx" style="padding:14px 22px;font-size:16px;border:0;border-radius:14px;background:#2f6df6;color:#fff">Réparer et relancer</button><p><a href="#" id="fy" style="color:#e5484d;font-size:14px">Effacer mes données et recommencer</a></p></div>';var clean=function(){var p=[];if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));return Promise.all(p)};document.getElementById("fx").onclick=function(){clean().then(function(){location.reload()})};document.getElementById("fy").onclick=function(e){e.preventDefault();if(confirm("Effacer toutes tes données sur cet appareil ?")){try{localStorage.clear()}catch(x){}clean().then(function(){location.reload()})}}}},2500);
</script>
<script src="config.js"></script>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var D={r1:0,r2:0,r3:0,t1:152,t2:185,mf:16.36,me:19.3,pd:8.87,nf:35.95,ne:42.42};
var S={days:{},set:Object.assign({},D),hist:{}};
try{var s=JSON.parse(localStorage.getItem('vh')||'null');if(s){S.days=s.days||{};S.set=Object.assign({},D,s.set||{});S.hist=s.hist||{}}}catch(e){}
for(var h0 in S.hist){if(typeof S.hist[h0]==='number')S.hist[h0]={p:S.hist[h0],e:0}}
S.me=(s&&s.me)||null;S.ob=(s&&s.ob)||0;S.auth=(s&&s.auth)||null;
function save(){try{localStorage.setItem('vh',JSON.stringify(S))}catch(e){}}
var tab='jour',sel=iso(new Date());
function iso(d){var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function parseH(v){v=String(v).trim().toLowerCase().replace(',','.');var m=v.match(/^(\d+)\s*[h:]\s*(\d*)$/);if(m)return +m[1]+(+m[2]||0)/60;var n=parseFloat(v);return isNaN(n)?0:n}
function fh(h){var t=Math.round(h*60),m=t%60;return Math.floor(t/60)+'h'+(m<10?'0':'')+m}
function eur(x){return x.toFixed(2).replace('.',',')+' €'}
function allow(d){var c=S.set,t=0;if(d.m==='fr')t+=c.mf;if(d.m==='et')t+=c.me;if(d.m2==='fr')t+=c.mf;if(d.m2==='et')t+=c.me;if(d.p)t+=c.pd;if(d.n==='fr')t+=c.nf;if(d.n==='et')t+=c.ne;return t}
function monday(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function tiers(H){var c=S.set,a=Math.min(H,c.t1),b=Math.max(0,Math.min(H,c.t2)-c.t1),e=Math.max(0,H-c.t2);return{a:a,b:b,e:e,pay:a*c.r1+b*c.r2+e*c.r3}}
function month(key){var h=0,al=0,n=0;for(var k in S.days){if(k.slice(0,7)===key){h+=S.days[k].h||0;al+=allow(S.days[k]);n++}}return{h:h,al:al,n:n}}
function histSummary(){var ks=Object.keys(S.hist).filter(function(k){return S.hist[k].p&&S.hist[k].e}),rp=0,re=0;ks.forEach(function(k){rp+=S.hist[k].p;re+=S.hist[k].e});var o='';if(rp)o+='<div class="mu" style="margin-top:8px">Montant moyen reçu par heure payée : <b>'+eur(re/rp)+'</b></div>';return o}
function rw(l,v){return'<div class="row"><span>'+l+'</span><b>'+eur(v)+'</b></div>'}
function ratio(){var a=0,b=0;Object.keys(S.hist).forEach(function(k){var x=S.hist[k];if(x.p&&x.e){a+=x.e-(x.f||0);b+=tiers(x.p).pay}});return b?a/b:0}
function avgF(){var t=0,n=0;Object.keys(S.hist).forEach(function(k){if(S.hist[k].f){t+=S.hist[k].f;n++}});return n?t/n:0}
function monthExtra(T,fp,av,w){
var rt=ratio(),af=avgF(),h=T.pay,f=fp;
if(av){h=w*T.pay+(1-w)*tiers(av).pay;if(af)f=w*fp+(1-w)*af}
return'<div class="sec"><h3>Net potentiel</h3>'+(rt?rw('Net estimé',rt*h+f)+'<div class="mu">D’après ton rythme du mois et tes mois précédents (net/brut : '+Math.round(rt*100)+' %)</div>':'<div class="mu">Ajoute tes mois précédents dans Réglages (heures payées, montant reçu, frais) pour estimer ton net.</div>')+'</div>'}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hello(){return'<div class="hi"><div class="mu">'+esc(S.me.ent)+'</div><div class="hn">Bonjour '+esc(S.me.prenom)+' 👋</div></div>'}
function pf(k,l,ro){return'<label>'+l+'</label><input data-me="'+k+'" value="'+esc(S.me[k])+'"'+(ro?' readonly':'')+'>'}
var PEND=null,OBMSG='',SYNCING=false;
var SB=(typeof SB_URL!=='undefined'&&typeof SB_KEY!=='undefined'&&SB_URL&&SB_KEY)?{u:String(SB_URL).replace(/\/$/,''),k:SB_KEY}:null;
function grpKey(e){return String(e).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
async function sbAuth(){if(!SB)return null;var a=S.auth,H={apikey:SB.k,'Content-Type':'application/json'};
try{if(a&&a.exp>Date.now()/1000+60)return a.at;var r=null;
if(a&&a.rt)r=await fetch(SB.u+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:H,body:JSON.stringify({refresh_token:a.rt})});
if(!r||!r.ok)r=await fetch(SB.u+'/auth/v1/signup',{method:'POST',headers:H,body:'{}'});
var j=await r.json();if(!j.access_token)return null;
S.auth={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+3000,uid:j.user.id};save();return j.access_token}catch(e){return null}}
async function sb(m,p,b,h){var t=await sbAuth();if(!t)throw 0;
var r=await fetch(SB.u+p,{method:m,headers:Object.assign({apikey:SB.k,Authorization:'Bearer '+t,'Content-Type':'application/json'},h||{}),body:b?JSON.stringify(b):undefined});
if(!r.ok)throw r.status;var x=await r.text();return x?JSON.parse(x):null}
async function syncMe(){if(!SB||!S.me||SYNCING||PEND)return;SYNCING=true;var before=JSON.stringify([S.me,tab]);
try{var t=await sbAuth();if(!t)throw 0;var uid=S.auth.uid;
var rows=await sb('GET','/rest/v1/profiles?id=eq.'+uid+'&select=id,admin');
if(!rows.length){
if(S.me.sync&&S.me.uid===uid){S.me=null;S.ob=0;S.auth=null;OBMSG='Ton compte a été supprimé par l’administrateur.';save();SYNCING=false;render();return}
await sb('POST','/rest/v1/profiles',{id:uid,prenom:S.me.prenom,nom:S.me.nom,ent:S.me.ent,grp:grpKey(S.me.ent),cs:S.me.cs},{Prefer:'return=minimal'});rows=[{admin:false}]}
S.me.sync=true;S.me.uid=uid;
if(S.me.ac){var code=S.me.ac,ok=await sb('POST','/rest/v1/rpc/claim_admin',{code:code});delete S.me.ac;if(ok)rows=[{admin:true}];else alert('Code administrateur incorrect.')}
S.me.admin=!!rows[0].admin;save()}catch(e){}
SYNCING=false;if(S.me&&!S.ob&&JSON.stringify([S.me,tab])!==before)render()}
async function adminLoad(){var box=document.getElementById('adm');if(!box)return;
try{var rows=await sb('GET','/rest/v1/profiles?select=id,prenom,nom,ent,created_at&order=created_at.desc');
box.innerHTML=rows.length?'<div class="mu" style="margin-bottom:6px">'+rows.length+' inscrit(s) dans ton groupe</div>'+rows.map(function(r){return'<div class="row"><span><b>'+esc(r.prenom)+' '+esc(r.nom)+'</b><div class="mu">'+esc(r.ent)+' · '+esc(String(r.created_at).slice(0,10))+'</div></span>'+(r.id===S.me.uid?'<span class="mu">toi</span>':'<span class="x" data-id="'+esc(r.id)+'" data-nm="'+esc(r.prenom+' '+r.nom)+'">Supprimer</span>')+'</div>'}).join(''):'<div class="mu">Aucun inscrit.</div>';
[].forEach.call(box.querySelectorAll('[data-id]'),function(b){b.onclick=function(){if(confirm('Supprimer le compte de '+b.dataset.nm+' ?'))sb('DELETE','/rest/v1/profiles?id=eq.'+b.dataset.id).then(adminLoad).catch(function(){alert('Suppression impossible.')})}})}
catch(e){box.innerHTML='<div class="mu">Liste indisponible (vérifie ta connexion).</div>'}}
if(SB)setTimeout(syncMe,400);
function legalHTML(){return'<div class="mu" style="line-height:1.6">'+(SB?'Pour créer ton compte, ton <b>prénom, ton nom et ton entreprise</b> sont enregistrés en ligne et visibles par l’administrateur de ton entreprise, qui peut supprimer ton compte. Tes heures, tarifs et frais restent <b>sur ton téléphone</b>. Tu peux supprimer ton compte à tout moment dans Réglages. Pour créer un compte, tu dois accepter.':'Pour fonctionner, l’appli enregistre ton prénom, ton nom, ton entreprise, tes heures, tes tarifs et tes frais. Ces données restent <b>sur ton téléphone</b> : elles ne sont envoyées à aucun serveur aujourd’hui. Tu peux les modifier dans Réglages et les effacer à tout moment en supprimant les données du site dans ton navigateur. Pour créer un compte, tu dois accepter.')+'</div>'+
'<details><summary>Mentions légales</summary><div class="mu" style="line-height:1.6;margin-top:8px"><b>Éditeur</b> : application gratuite et non commerciale, créée par Vincenzo De Pasquale.<br><b>Hébergement</b> : GitHub Pages (GitHub, Inc.)'+(SB?' ; base de données : Supabase, serveurs en Europe':'')+'.<br><b>Données traitées</b> : prénom, nom, entreprise, heures, tarifs et frais saisis. <b>Base légale</b> : ton consentement. <b>Durée</b> : '+(SB?'jusqu’à la suppression de ton compte, par toi ou par l’administrateur de ton entreprise.':'jusqu’à ce que tu effaces les données du site dans ton navigateur.')+'<br><b>Tes droits</b> (RGPD) : accès, rectification, effacement et retrait du consentement, que tu exerces directement dans l’appli (Réglages) ou en effaçant les données du site. '+(SB?'':'Si une fonction en ligne est ajoutée plus tard, tu en seras informé et ton accord sera demandé de nouveau.')+'<br><b>Estimations</b> : les montants affichés sont indicatifs, sans valeur contractuelle ; seule ta fiche de paie fait foi.</div></details>'}
function pn(x){return parseFloat(String(x).replace(',','.'))}
function onboard(el){
document.getElementById('nav').innerHTML='';
var st=!S.me?(PEND?0:1):S.ob,q=function(k){return el.querySelector('[data-o="'+k+'"]')},
f=function(k,l,v){return'<label>'+l+'</label><input data-o="'+k+'" inputmode="decimal" placeholder="0,00" value="'+(v||'')+'">'},
dots='<div class="dots">'+[1,2,3].map(function(n){return'<i class="'+(n<=Math.max(st,1)?'on':'')+'"></i>'}).join('')+'</div>',
head=function(t,m){return'<div class="hero"><div class="logo">🚛</div><h1 style="margin-bottom:6px">'+t+'</h1><div class="mu">'+m+'</div></div>'+dots},
err='<div class="mu" id="oerr" style="text-align:center;margin-top:10px"></div>',
bad=function(m){document.getElementById('oerr').textContent=m};
if(st===1){
el.innerHTML=head('Connexion','Crée ton profil. Tout reste enregistré sur ton téléphone.')+'<div class="card"><label>Prénom</label><input id="op" autocomplete="given-name"><label>Nom</label><input id="on" autocomplete="family-name"><label>Entreprise</label><input id="oe" autocomplete="organization">'+(SB?'<label>Code administrateur (facultatif)</label><input id="oa" autocomplete="off" placeholder="Laisse vide si tu n’en as pas">':'')+'</div><button id="go">Continuer</button>'+err;
if(OBMSG){bad(OBMSG);OBMSG=''}
document.getElementById('go').onclick=function(){var p=document.getElementById('op').value.trim(),n=document.getElementById('on').value.trim(),e=document.getElementById('oe').value.trim(),a=(document.getElementById('oa')||{value:''}).value.trim();
if(!p||!n||!e){bad('Merci de remplir prénom, nom et entreprise.');return}
PEND={prenom:p,nom:n,ent:e,ac:a};render()}}
else if(st===0){
el.innerHTML=head('Tes données personnelles','Avant de créer ton compte, lis ce qui suit puis fais ton choix.')+'<div class="card">'+legalHTML()+'</div><button id="ok">J’accepte</button><button class="s" id="no">Je refuse</button>';
document.getElementById('ok').onclick=function(){S.me={prenom:PEND.prenom,nom:PEND.nom,ent:PEND.ent,cs:iso(new Date())};if(PEND.ac)S.me.ac=PEND.ac;PEND=null;S.ob=2;save();render();syncMe()};
document.getElementById('no').onclick=function(){PEND=null;OBMSG='Tu dois accepter pour créer un compte.';render()}}
else if(st===2){
el.innerHTML=head('Tes tarifs','Indique ton tarif de base, les majorations se calculent toute seules.')+'<div class="card">'+f('r1','Tarif de base €/h')+'<div id="ox" style="display:none"><div class="g2">'+f('r2','Tarif 125 % €/h')+f('r3','Tarif 150 % €/h')+'</div></div></div><div class="card"><div class="g2">'+f('t1','125 % à partir de (h)',S.set.t1)+f('t2','150 % à partir de (h)',S.set.t2)+'</div></div><button id="go">Continuer</button>'+err;
var b=q('r1');b.oninput=function(){var v=pn(this.value),x=document.getElementById('ox');if(v>0){x.style.display='block';q('r2').value=Math.round(v*1250+1e-9)/1000;q('r3').value=Math.round(v*1500+1e-9)/1000}else x.style.display='none'};
document.getElementById('go').onclick=function(){var v=pn(q('r1').value);if(!(v>0)){bad('Indique ton tarif de base.');return}
S.set.r1=v;S.set.r2=pn(q('r2').value)||Math.round(v*1250+1e-9)/1000;S.set.r3=pn(q('r3').value)||Math.round(v*1500+1e-9)/1000;
var a=pn(q('t1').value),c=pn(q('t2').value);if(a>0)S.set.t1=a;if(c>0)S.set.t2=c;S.ob=3;save();render()}}
else{
el.innerHTML=head('Tes frais','Montants proposés par défaut : vérifie-les avec ta fiche de paie et modifie-les si besoin.')+'<div class="card"><div class="g2">'+f('mf','Repas France',S.set.mf)+f('me','Repas étranger',S.set.me)+f('pd','Casse-croûte',S.set.pd)+f('nf','Nuit France',S.set.nf)+f('ne','Nuit étranger',S.set.ne)+'</div></div><button id="go">Terminer</button>';
document.getElementById('go').onclick=function(){['mf','me','pd','nf','ne'].forEach(function(k){var v=pn(q(k).value);S.set[k]=isNaN(v)?0:v});S.ob=0;save();render()}}}
function dayPay(k){var key=k.slice(0,7),b=0,u=0;for(var x in S.days){if(x.slice(0,7)===key){if(x<k)b+=S.days[x].h;if(x<=k)u+=S.days[x].h}}return tiers(u).pay-tiers(b).pay}
function weekdays(y,m,upto){var c=0,n=new Date(y,m+1,0).getDate();for(var i=1;i<=n;i++){if(upto&&i>upto)break;var w=new Date(y,m,i).getDay();if(w>0&&w<6)c++}return c}
function V(h){return h.n?h.n:''}
function render(){
var el=document.getElementById('app'),h='';
if(!S.me||S.ob){onboard(el);return}
if(tab==='jour'){
var d=S.days[sel]||{h:0,m:'0',p:false,n:'0'};
h+=hello()+'<div class="card"><label>Date</label><input type="date" id="dt" value="'+sel+'">'+
'<label>Heures travaillées (ex. 9h30, 9:30 ou 9.5)</label><input id="hh" inputmode="text" value="'+(d.h?fh(d.h):'')+'" placeholder="0h00">'+
'<div class="g2"><div><label>Repas midi</label><select id="mm"><option value="0">Aucun</option><option value="fr">France</option><option value="et">Étranger</option></select></div><div><label>Repas soir</label><select id="m2"><option value="0">Aucun</option><option value="fr">France</option><option value="et">Étranger</option></select></div></div><div class="g2">'+
'<div><label>Nuit</label><select id="nn"><option value="0">Aucune</option><option value="fr">France</option><option value="et">Étranger</option></select></div></div>'+
'<label><input type="checkbox" id="pp" style="width:auto;margin-right:8px"'+(d.p?' checked':'')+'>Casse-croûte</label>'+
'<button id="sv">Enregistrer la journée</button></div>';
var ws=monday(pd(sel)),tot=0,al=0,wp=0,rows='';
for(var i=0;i<7;i++){var x=new Date(ws);x.setDate(x.getDate()+i);var k=iso(x),dd=S.days[k];if(dd){tot+=dd.h;al+=allow(dd);wp+=dayPay(k)}
rows+='<div class="row"><span>'+['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]+' '+x.getDate()+'</span><span>'+(dd?fh(dd.h)+' · '+eur(dayPay(k))+' · '+eur(allow(dd)):'—')+(dd?' <span class="x" data-del="'+k+'">✕</span>':'')+'</span></div>'}
h+='<div class="card hero2"><div class="lab">Semaine du '+ws.getDate()+'/'+(ws.getMonth()+1)+'</div><div class="big">'+eur(wp+al)+'</div><div class="sub">'+fh(tot)+' · frais compris</div><details><summary>Détails</summary><div class="mu" style="margin-top:8px">'+eur(wp)+' d’heures + '+eur(al)+' de frais</div><div style="margin-top:6px">'+rows+'</div></details></div>';
}
if(tab==='semaine'){
var W={};for(var k in S.days){var m=iso(monday(pd(k)));W[m]=W[m]||{h:0,a:0,p:0};W[m].h+=S.days[k].h;W[m].a+=allow(S.days[k]);W[m].p+=dayPay(k)}
var ks=Object.keys(W).sort(),cu={},cm={};ks.forEach(function(k){var mk=k.slice(0,7);cm[mk]=(cm[mk]||0)+W[k].p+W[k].a;cu[k]=cm[mk]});ks.reverse();
h+='<h1>Semaines</h1><div class="card">'+(ks.length?ks.map(function(k){var x=pd(k);return'<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Sem. du '+x.getDate()+'/'+(x.getMonth()+1)+'<div class="mu">'+fh(W[k].h)+' effectuées</div></span><b>'+eur(W[k].p+W[k].a)+'</b></div><details><summary style="margin-top:8px">Détails</summary><div class="mu" style="margin-top:6px">'+eur(W[k].p)+' heures + '+eur(W[k].a)+' frais</div><div class="mu">Cumul du mois : '+eur(cu[k])+'</div></details></div>'}).join(''):'<div class="mu">Aucune journée enregistrée.</div>')+'</div>';
}
if(tab==='mois'){
var now=new Date(),key=iso(now).slice(0,7),M=month(key),H=M.h,T=tiers(H),c=S.set;
var el2=weekdays(now.getFullYear(),now.getMonth(),now.getDate()),tt=weekdays(now.getFullYear(),now.getMonth()),pr=el2?M.h/el2*tt:0,Hp=pr,Tp=tiers(Hp),fp=el2?M.al/el2*tt:0;
var hk=Object.keys(S.hist),av=hk.length?hk.reduce(function(s,k){return s+S.hist[k].p},0)/hk.length:0;
var w=tt?Math.min(1,el2/tt):1,Hb=av?w*Hp+(1-w)*av:Hp,fb=avgF()?w*fp+(1-w)*avgF():fp,Tb=tiers(Hb),rt=ratio();
h+=hello()+(c.r1?'':'<div class="card"><div class="mu">Renseigne tes taux et indemnités dans Réglages pour voir tes montants.</div></div>')+
'<div class="card hero2"><div class="lab">À ce jour</div><div class="big">'+eur(T.pay+M.al)+'</div><div class="sub">'+fh(H)+' payées · frais compris</div><details><summary>Détails</summary>'+
'<div class="row"><span>Base · jusqu’à '+c.t1+'h</span><span>'+fh(T.a)+' · '+eur(T.a*c.r1)+'</span></div>'+
'<div class="row"><span>125 % · '+c.t1+'h–'+c.t2+'h</span><span>'+fh(T.b)+' · '+eur(T.b*c.r2)+'</span></div>'+
'<div class="row"><span>150 % · à partir de '+c.t2+'h</span><span>'+fh(T.e)+' · '+eur(T.e*c.r3)+'</span></div>'+
'<div class="row"><span>Frais</span><span>'+eur(M.al)+'</span></div>'+
'<div class="mu" style="margin-top:8px">Saisi : '+fh(M.h)+' sur '+M.n+' jours</div></details></div>'+
'<div class="card"><div class="lab">Estimation fin de mois</div><div class="big">'+eur(Tb.pay+fb)+'</div><div class="sub">≈ '+fh(Hb)+' payées · frais compris</div><details><summary>Détails</summary>'+rw('Heures',Tb.pay)+rw('Frais',fb)+(rt?rw('Net potentiel',rt*Tb.pay+fb):'<div class="mu" style="margin-top:8px">Ajoute tes mois précédents dans Réglages pour estimer ton net.</div>')+'</details></div>';
}
if(tab==='admin'&&S.me.admin){h+='<h1>Administration</h1><div class="card" id="adm"><div class="mu">Chargement…</div></div>'}
if(tab==='reglages'){
var c=S.set,f=function(k,l){return'<label>'+l+'</label><input data-s="'+k+'" inputmode="decimal" value="'+c[k]+'">'};
h+='<h1>Réglages</h1><div class="card"><h2>Mon profil</h2>'+pf('prenom','Prénom')+pf('nom','Nom')+pf('ent','Entreprise',S.me.sync)+(S.me.admin?'<div class="mu" style="margin-top:12px">🔑 Mode administrateur activé</div>':'')+'<details><summary>Mentions légales et données</summary><div style="margin-top:8px">'+legalHTML()+'</div></details>'+(S.me.sync?'<button class="s" id="delme" style="color:#e5484d">Supprimer mon compte</button>':'')+'</div><div class="card"><h2>Taux horaires</h2><div class="g2">'+f('r1','Tarif de base €/h')+f('r2','Tarif 125 % €/h')+f('r3','Tarif 150 % €/h')+f('t1','125 % à partir de (h)')+f('t2','150 % à partir de (h)')+'</div></div>'+
'<div class="card"><h2>Indemnités (€)</h2><div class="g2">'+f('mf','Repas France')+f('me','Repas étranger')+f('pd','Casse-croûte')+f('nf','Nuit France')+f('ne','Nuit étranger')+'</div></div>'+
'<div class="card"><h2>Mois précédents (fiches de paie)</h2><label>Mois</label><input type="month" id="hm"><label>Heures payées (ex. 165h30)</label><input id="hv" placeholder="0h00"><label>Montant total reçu (€, frais compris)</label><input id="he" inputmode="decimal" placeholder="0,00"><label>Dont frais / indemnités (€)</label><input id="hf" inputmode="decimal" placeholder="0,00"><button class="s" id="ah">Ajouter ce mois</button><div style="margin-top:8px">'+
Object.keys(S.hist).sort().reverse().map(function(k){var x=S.hist[k];return'<div class="row"><span>'+k+'</span><span style="text-align:right"><b>'+eur(x.e)+'</b><div class="mu">'+fh(x.p)+' payées <span class="x" data-dh="'+k+'">✕</span></div></span></div>'}).join('')+histSummary()+'</div></div>';
}
el.innerHTML=h;
if(tab==='admin'&&S.me.admin)adminLoad();
if(tab==='jour'){document.getElementById('mm').value=d.m||'0';document.getElementById('m2').value=d.m2||'0';document.getElementById('nn').value=d.n||'0';
document.getElementById('dt').onchange=function(){sel=this.value||sel;render()};
document.getElementById('sv').onclick=function(){S.days[sel]={h:parseH(document.getElementById('hh').value),m:document.getElementById('mm').value,m2:document.getElementById('m2').value,n:document.getElementById('nn').value,p:document.getElementById('pp').checked};save();render()};
[].forEach.call(el.querySelectorAll('[data-del]'),function(b){b.onclick=function(){delete S.days[b.dataset.del];save();render()}})}
if(tab==='reglages'){var ap=function(inp){var v=parseFloat(String(inp.value).replace(',','.')),k=inp.dataset.s;if(isNaN(v))return;S.set[k]=v;if(k==='r1'){S.set.r2=Math.round(v*1250+1e-9)/1000;S.set.r3=Math.round(v*1500+1e-9)/1000;var q2=el.querySelector('[data-s="r2"]'),q3=el.querySelector('[data-s="r3"]');if(q2)q2.value=S.set.r2;if(q3)q3.value=S.set.r3}save()};
[].forEach.call(el.querySelectorAll('[data-s]'),function(i){i.oninput=function(){ap(this)};i.onchange=function(){ap(this)}});
document.getElementById('ah').onclick=function(){var m=document.getElementById('hm').value,p=parseH(document.getElementById('hv').value),e=parseFloat(document.getElementById('he').value.replace(',','.'))||0;if(m&&(p||e)){S.hist[m]={p:p,e:e,f:parseFloat(document.getElementById('hf').value.replace(',','.'))||0};save();render()}};var dm=document.getElementById('delme');if(dm)dm.onclick=function(){if(confirm('Supprimer ton compte en ligne ? Tes données saisies sur ce téléphone restent.'))sb('DELETE','/rest/v1/profiles?id=eq.'+S.me.uid).then(function(){S.me=null;S.ob=0;S.auth=null;OBMSG='Ton compte a été supprimé.';save();render()}).catch(function(){alert('Suppression impossible pour le moment : vérifie ta connexion.')})};
[].forEach.call(el.querySelectorAll('[data-me]'),function(i){i.onchange=function(){S.me[this.dataset.me]=this.value.trim()||S.me[this.dataset.me];save();if(S.me.sync&&this.dataset.me!=='ent')sb('PATCH','/rest/v1/profiles?id=eq.'+S.me.uid,{prenom:S.me.prenom,nom:S.me.nom}).catch(function(){})}});
[].forEach.call(el.querySelectorAll('[data-dh]'),function(b){b.onclick=function(){delete S.hist[b.dataset.dh];save();render()}})}
var T2=[['jour','<span class="ic">📅</span>Jour'],['semaine','<span class="ic">🗓️</span>Semaines'],['mois','<span class="ic">💶</span>Mois'],['reglages','<span class="ic">⚙️</span>Réglages']];
if(S.me.admin)T2.push(['admin','<span class="ic">🔑</span>Admin']);
document.getElementById('nav').innerHTML=T2.map(function(t){return'<a href="#" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</a>'}).join('');
[].forEach.call(document.querySelectorAll('nav a'),function(a){a.onclick=function(e){e.preventDefault();tab=a.dataset.t;render()}});
}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
