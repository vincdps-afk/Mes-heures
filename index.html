<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#151a26;--mu:#7b8496;--ac:#2f6df6;--ac2:#6f93ff;--bd:#edf0f6;--sh:0 8px 28px rgba(30,45,90,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}

label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}

button{padding:15px;font-size:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;width:100%;margin-top:18px}

.hero2 .row{border-color:rgba(255,255,255,.22)}.hero2 summary{color:#fff}
details{margin-top:6px}

.sec{margin-top:6px}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:0 10px 34px rgba(20,30,60,.16);padding:6px;max-width:532px;margin:auto}

nav a.on{color:var(--ac);font-weight:700;background:var(--bg)}
.x{color:#e5484d;cursor:pointer;margin-left:8px}
.ok{color:#1f9d55;font-weight:600;margin-top:12px;font-size:14px}.pill{background:#e5484d;color:#fff;border-radius:10px;font-size:12px;font-style:normal;font-weight:700;padding:1px 8px}.bd{position:absolute;top:2px;right:16%;background:#e5484d;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-style:normal;font-weight:700;line-height:18px;padding:0 5px}.wcard{background:var(--bg);border-radius:16px;padding:14px;margin-top:10px}
.mo>summary{font-size:15px;margin-top:12px}details.wk{margin:4px 0 0 10px}.wk>summary{color:var(--tx);font-weight:500;margin-top:8px}.mo>summary,.wk>summary{display:flex;align-items:center;gap:8px}.sv{margin-left:auto;font-weight:500;color:var(--tx);font-size:14px;text-align:right}.wkrow{display:flex;justify-content:space-between;padding:10px 0 4px 10px;font-size:15px}.no{opacity:.45}.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}.tb th{color:var(--mu);font-weight:600}.tt td{font-weight:700;border-bottom:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}.pb{background:var(--card);border-radius:24px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}.pb h3{font-size:19px;margin:0 0 8px}.pb button{margin-top:12px}
.okc{color:#1f9d55;font-weight:700}
.fw{position:relative}.fw input{padding-right:52px}.fw .eu{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:14px;pointer-events:none}
.tp{display:flex;gap:6px;margin:4px 0 8px}.tpl{display:flex;align-items:center;gap:6px;margin:0;padding:4px 10px;border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:13px;flex:none}.tpl input{width:15px;height:15px;margin:0;padding:0}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 18px}.dots i{width:28px;height:6px;border-radius:3px;background:var(--bd)}.dots i.on{background:var(--ac)}

<script>
setTimeout(function(){var a=document.getElementById("app");if(a&&!a.innerHTML.trim()){document.body.innerHTML='<div style="font:16px system-ui;padding:28px;text-align:center"><h2>Un problème est survenu</h2><p>L’appli n’a pas pu démarrer. Tes données ne sont pas effacées.</p><button id="fx" style="padding:14px 22px;font-size:16px;border:0;border-radius:14px;background:#2f6df6;color:#fff">Réparer et relancer</button><p><a href="#" id="fy" style="color:#e5484d;font-size:14px">Effacer mes données et recommencer</a></p></div>';var clean=function(){var p=[];if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));if(window.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));return Promise.all(p)};document.getElementById("fx").onclick=function(){clean().then(function(){location.reload()})};document.getElementById("fy").onclick=function(e){e.preventDefault();if(this.dataset.c!=="1"){this.dataset.c="1";this.textContent="Appuie encore pour tout effacer";return}{try{localStorage.clear()}catch(x){}clean().then(function(){location.reload()})}}}},2500);
</script>

<script>
var D={r1:0,r2:0,r3:0,n1:9.92,n2:12.4,n3:16.54,t1:152,t2:185,mf:16.36,me:19.3,pd:8.87,nf:35.95,ne:42.42};
var S={days:{},set:Object.assign({},D),hist:{}};
try{var s=JSON.parse(localStorage.getItem('vh')||'null');if(s){S.days=s.days||{};S.set=Object.assign({},D,s.set||{});S.hist=s.hist||{}}}catch(e){}
for(var h0 in S.hist){if(typeof S.hist[h0]==='number')S.hist[h0]={p:S.hist[h0],e:0}}
S.me=(s&&s.me)||null;S.ob=(s&&s.ob)||0;S.auth=(s&&s.auth)||null;S.net=!!(s&&s.net);S.lock=(s&&s.lock)||null;S.rep=(s&&typeof s.rep==='boolean')?s.rep:null;S.delQ=(s&&s.delQ)||[];S.sent=(s&&s.sent)||{};S.sentD=(s&&s.sentD)||{};Object.keys(S.sent).forEach(function(k){if(S.sent[k]&&S.sent[k].sig)try{JSON.parse(S.sent[k].sig).forEach(function(x){S.sentD[x.d]=JSON.stringify(x)})}catch(e){}});
function save(){try{localStorage.setItem('vh',JSON.stringify(S))}catch(e){}}
var tab='jour',sel=iso(new Date());
function iso(d){var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function parseH(v){v=String(v).trim().toLowerCase().replace(',','.');var m=v.match(/^(\d+)\s*[h:]\s*(\d*)$/);if(m)return +m[1]+(+m[2]||0)/60;var n=parseFloat(v);return isNaN(n)?0:n}
function fh(h){var t=Math.round(h*60),m=t%60;return Math.floor(t/60)+'h'+(m<10?'0':'')+m}
function eur(x){return x.toFixed(2).replace('.',',')+' €'}
function allow(d){var c=S.set,t=0;if(d.m==='fr')t+=c.mf;if(d.m==='et')t+=c.me;if(d.m2==='fr')t+=c.mf;if(d.m2==='et')t+=c.me;if(d.p)t+=c.pd;if(d.n==='fr')t+=c.nf;if(d.n==='et')t+=c.ne;return t}
function monday(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function tiers(H,nt){if(nt===undefined)nt=!!S.net;var c=S.set,a=Math.min(H,c.t1),b=Math.max(0,Math.min(H,c.t2)-c.t1),e=Math.max(0,H-c.t2);return{a:a,b:b,e:e,pay:nt?a*c.n1+b*c.n2+e*c.n3:a*c.r1+b*c.r2+e*c.r3}}
function month(key){var h=0,al=0,n=0;for(var k in S.days){if(k.slice(0,7)===key){h+=S.days[k].h||0;al+=allow(S.days[k]);n++}}return{h:h,al:al,n:n}}
function histSummary(){var ks=Object.keys(S.hist).filter(function(k){return S.hist[k].p&&S.hist[k].e}),rp=0,re=0;ks.forEach(function(k){rp+=S.hist[k].p;re+=S.hist[k].e});var o='';if(rp)o+='<div class="mu" style="margin-top:8px">Montant moyen reçu par heure payée : <b>'+eur(re/rp)+'</b></div>';return o}
function rw(l,v){return'<div class="row"><span>'+l+'</span><b>'+eur(v)+'</b></div>'}
function ratio(){var a=0,b=0;Object.keys(S.hist).forEach(function(k){var x=S.hist[k];if(x.p&&x.e){a+=x.e-(x.f||0);b+=tiers(x.p,false).pay}});return b?a/b:0}
function avgF(){var t=0,n=0;Object.keys(S.hist).forEach(function(k){if(S.hist[k].f){t+=S.hist[k].f;n++}});return n?t/n:0}
function monthExtra(T,fp,av,w){
var rt=ratio(),af=avgF(),h=T.pay,f=fp;
if(av){h=w*T.pay+(1-w)*tiers(av,false).pay;if(af)f=w*fp+(1-w)*af}
return'<div class="sec"><h3>Net potentiel</h3>'+(rt?rw('Net estimé',rt*h+f)+'<div class="mu">D’après ton rythme du mois et tes mois précédents (net/brut : '+Math.round(rt*100)+' %)</div>':'<div class="mu">Ajoute tes mois précédents dans Réglages (heures payées, montant reçu, frais) pour estimer ton net.</div>')+'</div>'}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hello(){return'<div class="hi"><div class="mu">'+esc(S.me.ent)+'</div><div class="hn">Bonjour '+esc(S.me.prenom)+' 👋</div></div>'}
function pf(k,l,ro){return'<label>'+l+'</label><input data-me="'+k+'" value="'+esc(S.me[k])+'"'+(ro?' readonly':'')+'>'}
var PEND=null,OBMSG='',SYNCING=false,MODE='new',FLUSHING=false;
var SB=(typeof SB_URL!=='undefined'&&typeof SB_KEY!=='undefined'&&SB_URL&&SB_KEY)?{u:String(SB_URL).replace(/\/$/,''),k:SB_KEY}:null;
function grpKey(e){return String(e).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
async function sbAuth(){if(!SB)return null;var a=S.auth,H={apikey:SB.k,'Content-Type':'application/json'};
try{if(a&&a.exp>Date.now()/1000+60)return a.at;var r=null;
if(a&&a.rt)r=await fetch(SB.u+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:H,body:JSON.stringify({refresh_token:a.rt})});
if(!r||!r.ok)r=await fetch(SB.u+'/auth/v1/signup',{method:'POST',headers:H,body:'{}'});
var j=await r.json();if(!j.access_token)return null;
S.auth={at:j.access_token,rt:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+3000,uid:j.user.id};save();return j.access_token}catch(e){return null}}
async function sb(m,p,b,h){var t=await sbAuth();if(!t)throw 0;
var r=await fetch(SB.u+p,{method:m,headers:Object.assign({apikey:SB.k,Authorization:'Bearer '+t,'Content-Type':'application/json'},h||{}),body:b?JSON.stringify(b):undefined});
var x=await r.text();if(!r.ok)throw{status:r.status,body:x};return x?JSON.parse(x):null}
async function syncMe(){if(!SB||!S.me||SYNCING||PEND)return;SYNCING=true;var before=JSON.stringify([S.me,tab]);
try{var t=await sbAuth();if(!t)throw 0;var uid=S.auth.uid;
var rows=await sb('GET','/rest/v1/profiles?id=eq.'+uid+'&select=id,admin,has_pin');
if(!rows.length){var gone=function(m){S.me=null;S.ob=0;S.auth=null;OBMSG=m;save();SYNCING=false;render()};
if(S.me.sync&&S.me.uid===uid){var mv=await sb('GET','/rest/v1/moved_ids?old_uid=eq.'+uid+'&select=old_uid');gone(mv.length?'Ton compte a été ouvert sur un autre appareil : reconnecte-toi avec ton code personnel.':'Ton compte a été supprimé par l’administrateur.');return}
if(S.me.sync){gone('Session expirée : reconnecte-toi avec ton code personnel.');return}
gone('Mise à jour : crée ton compte (ou connecte-toi) pour continuer.');return}
S.me.sync=true;S.me.uid=uid;S.me.hp=!!rows[0].has_pin;
if(S.me.ac){var code=S.me.ac,ok=await sb('POST','/rest/v1/rpc/claim_admin',{code:code});delete S.me.ac;if(ok)rows=[{admin:true}];else toast('Code administrateur incorrect.',1)}
S.me.admin=!!rows[0].admin;save()}catch(e){}
SYNCING=false;if(S.me&&!S.ob&&JSON.stringify([S.me,tab])!==before)render();if(S.me&&S.me.admin)adminBadge();flushDel();reportStatus()}
var ADM={n:0,open:{},w:{},year:new Date().getFullYear(),rY:new Date().getFullYear(),rM:new Date().getMonth()};
function refreshNav(){var a=document.querySelector('nav a[data-t="admin"]');if(!a)return;var b=a.querySelector('.bd');if(ADM.n){if(!b){b=document.createElement('i');b.className='bd';a.appendChild(b)}b.textContent=ADM.n}else if(b)b.parentNode.removeChild(b)}
async function adminBadge(){if(!SB||!S.me||!S.me.admin||!S.me.uid)return;try{var r=await sb('GET','/rest/v1/weeks?select=id&seen=eq.false&user_id=neq.'+S.me.uid);ADM.n=r.length;refreshNav()}catch(e){}}
function toast(m,bad){var d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:16px;right:16px;bottom:100px;z-index:9;padding:14px 16px;border-radius:16px;color:#fff;text-align:center;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.25);background:'+(bad?'#e5484d':'#1f9d55');document.body.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},3500)}
function fdt(t){var d=new Date(t);return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function weekData(k){var o=[];Object.keys(S.days).sort().forEach(function(d){if(iso(monday(pd(d)))===k)o.push(dayObj(d))});return o}
function codes(x){var c={rf:0,re:0,cc:0,nf:0,ne:0};[x.m,x.m2].forEach(function(v){if(v==='fr')c.rf++;else if(v==='et')c.re++});if(x.p)c.cc++;if(x.n==='fr')c.nf++;else if(x.n==='et')c.ne++;return c}
function codeStr(c){return['rf','re','cc','nf','ne'].filter(function(k){return c[k]}).map(function(k){return c[k]+' '+k}).join(' · ')}
function weekCodes(ds){var t={rf:0,re:0,cc:0,nf:0,ne:0};(ds||[]).forEach(function(x){var c=codes(x);for(var k in t)t[k]+=c[k]});return codeStr(t)||'aucun'}
var LEG='rf = repas France · re = repas étranger · cc = casse-croûte · nf = nuit France · ne = nuit étranger';
function dayLine(x){var c=x.t?TL[x.t]:codeStr(codes(x));return['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][pd(x.d).getDay()]+' '+x.d.slice(8)+'/'+x.d.slice(5,7)+' · '+fh(x.h)+(c?' · '+c:'')}
function pendingDays(k){return weekData(k).filter(function(x){return S.sentD[x.d]!==JSON.stringify(x)})}
function sendBlock(k){if(!SB||!S.me.sync)return'';var n=pendingDays(k).length,st=S.sent[k];
return'<div style="text-align:center;margin-top:16px">'+((S.delQ||[]).length?'<div class="mu" style="margin-bottom:8px">⏳ '+S.delQ.length+' suppression'+(S.delQ.length>1?'s':'')+' à transmettre aux bureaux</div>':'')+(n?'<div class="mu" style="margin-bottom:8px">'+n+' jour'+(n>1?'s':'')+' à envoyer</div>':(st&&!(S.delQ||[]).length&&weekData(k).length?'<div class="ok" style="margin:0 0 8px">✅ Tout est transmis (le '+fdt(st.t)+')</div>':''))+'<button class="'+(n?'':'s')+'" data-send="'+k+'" style="width:auto;padding:14px 22px;margin:0 auto">Envoyer mes heures et frais aux bureaux</button></div>'}
function reconcileDel(){Object.keys(S.sentD).forEach(function(d){if(!S.days[d]){S.delQ=S.delQ||[];if(!S.delQ.some(function(q){return q.d===d}))S.delQ.push({w:iso(monday(pd(d))),d:d});delete S.sentD[d]}})}
async function flushDel(loud){if(!SB||!S.me||!S.me.sync||FLUSHING)return;reconcileDel();if(!S.delQ||!S.delQ.length){save();return}FLUSHING=true;
try{while(S.delQ.length){var x=S.delQ[0];await sb('POST','/rest/v1/rpc/delete_day',{p_week:x.w,p_day:x.d});S.delQ.shift();if(weekData(x.w).length)S.sent[x.w]={t:new Date().toISOString()};else delete S.sent[x.w];save()}toast('✅ Suppression transmise aux bureaux');render();reportStatus()}
catch(e){save();if(loud)toast('⏳ Suppression en attente : elle sera transmise dès que la connexion revient',1)}
FLUSHING=false}
function ask(t,m,ok,fn){popup(t,m,[{t:ok,fn:fn},{t:'Annuler',s:1}])}
function showText(t){popup('Copie ce texte','<textarea readonly style="width:100%;height:160px;margin-top:8px;font-size:13px" onclick="this.select()">'+esc(t)+'</textarea>',[{t:'Fermer',s:1}])}
function delDay(k){var wk=iso(monday(pd(k))),was=S.sentD[k]!==undefined&&!!(SB&&S.me.sync);
var go=function(){delete S.days[k];if(was){delete S.sentD[k];S.delQ=S.delQ||[];S.delQ.push({w:wk,d:k})}if(!weekData(wk).length)delete S.sent[wk];save();render();if(was)flushDel(true);reportStatus()};
if(was)ask('Supprimer la journée ?','Cette journée a déjà été transmise aux bureaux. La supprimer aussi chez eux ?','Oui, supprimer',go);else go()}
async function sendDays(k,ds,btn){btn=btn||{};if(!ds.length){toast('✅ Tout est déjà transmis aux bureaux');return}var old=btn.textContent;btn.disabled=true;btn.textContent='Transmission…';
try{var tot=ds.reduce(function(s,d){return s+d.h},0),t=await sb('POST','/rest/v1/rpc/send_week',{p_week:k,p_days:ds,p_total:tot});
ds.forEach(function(x){S.sentD[x.d]=JSON.stringify(x)});S.delQ=(S.delQ||[]).filter(function(q){return ds.every(function(x){return x.d!==q.d})});S.sent[k]={t:t||new Date().toISOString()};save();reportStatus();toast(ds.length>1?'✅ '+ds.length+' jours transmis aux bureaux':'✅ Journée transmise aux bureaux');render()}
catch(e){btn.disabled=false;btn.textContent=old;toast('❌ Transmission impossible : vérifie ta connexion et réessaie',1)}}
function sendWeek(k,btn){flushDel();return sendDays(k,pendingDays(k),btn)}
function weekText(r,w){var d=pd(w.week);return r.prenom+' '+r.nom+' — semaine du '+d.getDate()+'/'+(d.getMonth()+1)+' ('+fh(w.total_h||0)+')\n'+(w.days||[]).map(dayLine).join('\n')+'\nTotal : '+weekCodes(w.days)+'\n('+LEG+')'}
