<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6df6">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes heures – Van Haecke</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#151a26;--mu:#7b8496;--ac:#2f6df6;--ac2:#6f93ff;--bd:#edf0f6;--sh:0 8px 28px rgba(30,45,90,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px;-webkit-font-smoothing:antialiased}
main{padding:22px 18px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 2px 18px}
h2,.lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:600;margin:0 0 10px}
h3{font-size:14px;margin:16px 0 6px}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
input,select{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--ac)}
button{padding:15px;font-size:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;width:100%;margin-top:18px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.mu,.sub{color:var(--mu);font-size:13px}
.sub{font-size:14px;margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hi{margin:8px 2px 20px}.hn{font-size:27px;font-weight:700;letter-spacing:-.02em}
.hero{text-align:center;margin:20px 0 24px}.logo{font-size:46px}
.hero2{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.hero2 .lab,.hero2 .sub,.hero2 .mu{color:rgba(255,255,255,.8)}
.hero2 .row{border-color:rgba(255,255,255,.22)}.hero2 summary{color:#fff}
details{margin-top:6px}
summary{cursor:pointer;color:var(--ac);font-size:14px;font-weight:600;list-style:none;margin-top:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}details[open] summary::after{content:" ▴"}
.sec{margin-top:6px}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:0 10px 34px rgba(20,30,60,.16);padding:6px;max-width:532px;margin:auto}
nav a{flex:1;text-align:center;padding:9px 2px;font-size:12px;color:var(--mu);text-decoration:none;border-radius:20px}
nav a .ic{display:block;font-size:20px;line-height:1.2}
nav a.on{color:var(--ac);font-weight:700;background:var(--bg)}
.x{color:#e5484d;cursor:pointer;margin-left:8px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var D={r1:0,r2:0,r3:0,t1:152,t2:185,mf:0,me:0,pd:0,nf:0,ne:0};
var S={days:{},set:Object.assign({},D),hist:{}};
try{var s=JSON.parse(localStorage.getItem('vh')||'null');if(s){S.days=s.days||{};S.set=Object.assign({},D,s.set||{});S.hist=s.hist||{}}}catch(e){}
for(var h0 in S.hist){if(typeof S.hist[h0]==='number')S.hist[h0]={p:S.hist[h0],e:0}}
S.me=(s&&s.me)||null;
function save(){try{localStorage.setItem('vh',JSON.stringify(S))}catch(e){}}
var tab='jour',sel=iso(new Date());
function iso(d){var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function parseH(v){v=String(v).trim().toLowerCase().replace(',','.');var m=v.match(/^(\d+)\s*[h:]\s*(\d*)$/);if(m)return +m[1]+(+m[2]||0)/60;var n=parseFloat(v);return isNaN(n)?0:n}
function fh(h){var t=Math.round(h*60),m=t%60;return Math.floor(t/60)+'h'+(m<10?'0':'')+m}
function eur(x){return x.toFixed(2).replace('.',',')+' €'}
function allow(d){var c=S.set,t=0;if(d.m==='fr')t+=c.mf;if(d.m==='et')t+=c.me;if(d.m2==='fr')t+=c.mf;if(d.m2==='et')t+=c.me;if(d.p)t+=c.pd;if(d.n==='fr')t+=c.nf;if(d.n==='et')t+=c.ne;return t}
function monday(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function tiers(H){var c=S.set,a=Math.min(H,c.t1),b=Math.max(0,Math.min(H,c.t2)-c.t1),e=Math.max(0,H-c.t2);return{a:a,b:b,e:e,pay:a*c.r1+b*c.r2+e*c.r3}}
function month(key){var h=0,al=0,n=0;for(var k in S.days){if(k.slice(0,7)===key){h+=S.days[k].h||0;al+=allow(S.days[k]);n++}}return{h:h,al:al,n:n}}
function histSummary(){var ks=Object.keys(S.hist).filter(function(k){return S.hist[k].p&&S.hist[k].e}),rp=0,re=0;ks.forEach(function(k){rp+=S.hist[k].p;re+=S.hist[k].e});var o='';if(rp)o+='<div class="mu" style="margin-top:8px">Montant moyen reçu par heure payée : <b>'+eur(re/rp)+'</b></div>';return o}
function rw(l,v){return'<div class="row"><span>'+l+'</span><b>'+eur(v)+'</b></div>'}
function ratio(){var a=0,b=0;Object.keys(S.hist).forEach(function(k){var x=S.hist[k];if(x.p&&x.e){a+=x.e-(x.f||0);b+=tiers(x.p).pay}});return b?a/b:0}
function avgF(){var t=0,n=0;Object.keys(S.hist).forEach(function(k){if(S.hist[k].f){t+=S.hist[k].f;n++}});return n?t/n:0}
function exoH(T){var m=S.set.exo||'both';return m==='none'?0:m==='150'?T.e*S.set.r3:T.b*S.set.r2+T.e*S.set.r3}
function monthExtra(T,fp,av){
var rt=ratio(),af=avgF()||fp,o='<div class="sec"><h3>Salaire potentiel (net)</h3>';
if(rt){o+=rw('Selon ton rythme actuel',rt*T.pay+fp);if(av)o+=rw('Selon la moyenne de tes mois',rt*tiers(av).pay+af);o+='<div class="mu">Rapport net/brut tiré de tes fiches : '+Math.round(rt*100)+' %'+(avgF()?'':'. Indique aussi les frais reçus pour plus de précision')+'</div>'}
else o+='<div class="mu">Ajoute tes mois précédents dans Réglages (heures payées, montant reçu, frais) pour estimer ton net.</div>';
o+='</div>';
var xh=exoH(T),xt=xh+fp;
o+='<div class="sec"><h3>Exonéré d’impôt (estimation)</h3>'+rw('Heures majorées',xh)+rw('Frais (indemnités)',fp)+'<div class="row"><b>Total exonéré</b><b>'+eur(xt)+'</b></div>'+rw('Heures encore imposables (brut)',Math.max(0,T.pay-xh))+'<div class="mu" style="margin-top:6px">Heures supplémentaires exonérées d’impôt jusqu’à 7 500 € nets par an ; frais exonérés dans la limite du barème. Estimation indicative, à vérifier sur ta fiche et sur impots.gouv.fr.</div></div>';
return o}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hello(){return'<div class="hi"><div class="mu">'+esc(S.me.ent)+'</div><div class="hn">Bonjour '+esc(S.me.prenom)+' 👋</div></div>'}
function pf(k,l){return'<label>'+l+'</label><input data-me="'+k+'" value="'+esc(S.me[k])+'">'}
function onboard(el){
var f=function(k,l,v){return'<label>'+l+'</label><input data-o="'+k+'" inputmode="decimal" placeholder="0,00" value="'+(v||'')+'">'};
document.getElementById('nav').innerHTML='';
el.innerHTML='<div class="hero"><div class="logo">🚛</div><h1 style="margin-bottom:6px">Bienvenue</h1><div class="mu">Crée ton profil. Tout reste enregistré sur ton téléphone.</div></div>'+
'<div class="card"><h2>Toi</h2><label>Prénom</label><input id="op" autocomplete="given-name"><label>Nom</label><input id="on" autocomplete="family-name"><label>Entreprise</label><input id="oe" autocomplete="organization"></div>'+
'<div class="card"><h2>Ton contrat (modifiable plus tard)</h2><div class="g2">'+f('r1','Tarif de base €/h')+f('t1','125 % à partir de (h)',152)+f('t2','150 % à partir de (h)',185)+'</div></div>'+
'<div class="card"><h2>Indemnités (€)</h2><div class="g2">'+f('mf','Repas France')+f('me','Repas étranger')+f('pd','Petit-déj')+f('nf','Nuit France')+f('ne','Nuit étranger')+'</div></div>'+
'<button id="go">Commencer</button><div class="mu" id="oerr" style="text-align:center;margin-top:10px"></div>';
document.getElementById('go').onclick=function(){var p=document.getElementById('op').value.trim(),n=document.getElementById('on').value.trim(),e=document.getElementById('oe').value.trim();
if(!p||!n||!e){document.getElementById('oerr').textContent='Merci de remplir prénom, nom et entreprise.';return}
S.me={prenom:p,nom:n,ent:e};[].forEach.call(el.querySelectorAll('[data-o]'),function(i){var v=parseFloat(String(i.value).replace(',','.'));if(!isNaN(v))S.set[i.dataset.o]=v});S.set.r2=Math.round(S.set.r1*1250+1e-9)/1000;S.set.r3=Math.round(S.set.r1*1500+1e-9)/1000;save();render()}}
function dayPay(k){var key=k.slice(0,7),b=0,u=0;for(var x in S.days){if(x.slice(0,7)===key){if(x<k)b+=S.days[x].h;if(x<=k)u+=S.days[x].h}}return tiers(u).pay-tiers(b).pay}
function weekdays(y,m,upto){var c=0,n=new Date(y,m+1,0).getDate();for(var i=1;i<=n;i++){if(upto&&i>upto)break;var w=new Date(y,m,i).getDay();if(w>0&&w<6)c++}return c}
function V(h){return h.n?h.n:''}
function render(){
var el=document.getElementById('app'),h='';
if(!S.me){onboard(el);return}
if(tab==='jour'){
var d=S.days[sel]||{h:0,m:'0',p:false,n:'0'};
h+=hello()+'<div class="card"><label>Date</label><input type="date" id="dt" value="'+sel+'">'+
'<label>Heures travaillées (ex. 9h30, 9:30 ou 9.5)</label><input id="hh" inputmode="text" value="'+(d.h?fh(d.h):'')+'" placeholder="0h00">'+
'<div class="g2"><div><label>Repas midi</label><select id="mm"><option value="0">Aucun</option><option value="fr">France</option><option value="et">Étranger</option></select></div><div><label>Repas soir</label><select id="m2"><option value="0">Aucun</option><option value="fr">France</option><option value="et">Étranger</option></select></div></div><div class="g2">'+
'<div><label>Nuit</label><select id="nn"><option value="0">Aucune</option><option value="fr">France</option><option value="et">Étranger</option></select></div></div>'+
'<label><input type="checkbox" id="pp" style="width:auto;margin-right:8px"'+(d.p?' checked':'')+'>Petit-déjeuner</label>'+
'<button id="sv">Enregistrer la journée</button></div>';
var ws=monday(pd(sel)),tot=0,al=0,wp=0,rows='';
for(var i=0;i<7;i++){var x=new Date(ws);x.setDate(x.getDate()+i);var k=iso(x),dd=S.days[k];if(dd){tot+=dd.h;al+=allow(dd);wp+=dayPay(k)}
rows+='<div class="row"><span>'+['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]+' '+x.getDate()+'</span><span>'+(dd?fh(dd.h)+' · '+eur(dayPay(k))+' · '+eur(allow(dd)):'—')+(dd?' <span class="x" data-del="'+k+'">✕</span>':'')+'</span></div>'}
h+='<div class="card hero2"><div class="lab">Semaine du '+ws.getDate()+'/'+(ws.getMonth()+1)+'</div><div class="big">'+eur(wp+al)+'</div><div class="sub">'+fh(tot)+' · frais compris</div><details><summary>Détails</summary><div class="mu" style="margin-top:8px">'+eur(wp)+' d’heures + '+eur(al)+' de frais</div><div style="margin-top:6px">'+rows+'</div></details></div>';
}
if(tab==='semaine'){
var W={};for(var k in S.days){var m=iso(monday(pd(k)));W[m]=W[m]||{h:0,a:0,p:0};W[m].h+=S.days[k].h;W[m].a+=allow(S.days[k]);W[m].p+=dayPay(k)}
var ks=Object.keys(W).sort(),cu={},cm={};ks.forEach(function(k){var mk=k.slice(0,7);cm[mk]=(cm[mk]||0)+W[k].p+W[k].a;cu[k]=cm[mk]});ks.reverse();
h+='<h1>Semaines</h1><div class="card">'+(ks.length?ks.map(function(k){var x=pd(k);return'<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Sem. du '+x.getDate()+'/'+(x.getMonth()+1)+'<div class="mu">'+fh(W[k].h)+' effectuées</div></span><b>'+eur(W[k].p+W[k].a)+'</b></div><details><summary style="margin-top:8px">Détails</summary><div class="mu" style="margin-top:6px">'+eur(W[k].p)+' heures + '+eur(W[k].a)+' frais</div><div class="mu">Cumul du mois : '+eur(cu[k])+'</div></details></div>'}).join(''):'<div class="mu">Aucune journée enregistrée.</div>')+'</div>';
}
if(tab==='mois'){
var now=new Date(),key=iso(now).slice(0,7),M=month(key),H=M.h,T=tiers(H),c=S.set;
var el2=weekdays(now.getFullYear(),now.getMonth(),now.getDate()),tt=weekdays(now.getFullYear(),now.getMonth()),pr=el2?M.h/el2*tt:0,Hp=pr,Tp=tiers(Hp),fp=el2?M.al/el2*tt:0;
var hk=Object.keys(S.hist),av=hk.length?hk.reduce(function(s,k){return s+S.hist[k].p},0)/hk.length:0;
h+=hello()+(c.r1?'':'<div class="card"><div class="mu">Renseigne tes taux et indemnités dans Réglages pour voir tes montants.</div></div>')+
'<div class="card hero2"><div class="lab">À ce jour</div><div class="big">'+eur(T.pay+M.al)+'</div><div class="sub">'+fh(H)+' payées · frais compris</div><details><summary>Détails</summary>'+
'<div class="row"><span>Base · jusqu’à '+c.t1+'h</span><span>'+fh(T.a)+' · '+eur(T.a*c.r1)+'</span></div>'+
'<div class="row"><span>125 % · '+c.t1+'h–'+c.t2+'h</span><span>'+fh(T.b)+' · '+eur(T.b*c.r2)+'</span></div>'+
'<div class="row"><span>150 % · à partir de '+c.t2+'h</span><span>'+fh(T.e)+' · '+eur(T.e*c.r3)+'</span></div>'+
'<div class="row"><span>Frais</span><span>'+eur(M.al)+'</span></div>'+
'<div class="mu" style="margin-top:8px">Saisi : '+fh(M.h)+' sur '+M.n+' jours</div></details></div>'+
'<div class="card"><div class="lab">Estimation fin de mois</div><div class="big">'+eur(Tp.pay+fp)+'</div><div class="sub">≈ '+fh(Hp)+' payées · frais compris</div><details><summary>Détails</summary>'+
rw('Heures',Tp.pay)+rw('Frais',fp)+(av?'<div class="mu" style="margin-top:6px">Moyenne de tes mois précédents : '+fh(av)+' ≈ '+eur(tiers(av).pay)+' (hors frais)</div>':'')+monthExtra(Tp,fp,av)+'</details></div>';
}
if(tab==='reglages'){
var c=S.set,f=function(k,l){return'<label>'+l+'</label><input data-s="'+k+'" inputmode="decimal" value="'+c[k]+'">'};
h+='<h1>Réglages</h1><div class="card"><h2>Mon profil</h2>'+pf('prenom','Prénom')+pf('nom','Nom')+pf('ent','Entreprise')+'</div><div class="card"><h2>Taux horaires</h2><div class="g2">'+f('r1','Tarif de base €/h')+f('r2','Tarif 125 % €/h')+f('r3','Tarif 150 % €/h')+f('t1','125 % à partir de (h)')+f('t2','150 % à partir de (h)')+'</div></div>'+
'<div class="card"><h2>Exonération d’impôt</h2><label>Heures exonérées</label><select id="sx"><option value="both">Heures à 125 % et 150 %</option><option value="150">Heures à 150 % seulement</option><option value="none">Aucune</option></select></div>'+
'<div class="card"><h2>Indemnités (€)</h2><div class="g2">'+f('mf','Repas France')+f('me','Repas étranger')+f('pd','Petit-déj')+f('nf','Nuit France')+f('ne','Nuit étranger')+'</div></div>'+
'<div class="card"><h2>Mois précédents (fiches de paie)</h2><label>Mois</label><input type="month" id="hm"><label>Heures payées (ex. 165h30)</label><input id="hv" placeholder="0h00"><label>Montant total reçu (€, frais compris)</label><input id="he" inputmode="decimal" placeholder="0,00"><label>Dont frais / indemnités (€)</label><input id="hf" inputmode="decimal" placeholder="0,00"><button class="s" id="ah">Ajouter ce mois</button><div style="margin-top:8px">'+
Object.keys(S.hist).sort().reverse().map(function(k){var x=S.hist[k];return'<div class="row"><span>'+k+'</span><span style="text-align:right"><b>'+eur(x.e)+'</b><div class="mu">'+fh(x.p)+' payées <span class="x" data-dh="'+k+'">✕</span></div></span></div>'}).join('')+histSummary()+'</div></div>';
}
el.innerHTML=h;
if(tab==='jour'){document.getElementById('mm').value=d.m||'0';document.getElementById('m2').value=d.m2||'0';document.getElementById('nn').value=d.n||'0';
document.getElementById('dt').onchange=function(){sel=this.value||sel;render()};
document.getElementById('sv').onclick=function(){S.days[sel]={h:parseH(document.getElementById('hh').value),m:document.getElementById('mm').value,m2:document.getElementById('m2').value,n:document.getElementById('nn').value,p:document.getElementById('pp').checked};save();render()};
[].forEach.call(el.querySelectorAll('[data-del]'),function(b){b.onclick=function(){delete S.days[b.dataset.del];save();render()}})}
if(tab==='reglages'){var ap=function(inp){var v=parseFloat(String(inp.value).replace(',','.')),k=inp.dataset.s;if(isNaN(v))return;S.set[k]=v;if(k==='r1'){S.set.r2=Math.round(v*1250+1e-9)/1000;S.set.r3=Math.round(v*1500+1e-9)/1000;var q2=el.querySelector('[data-s="r2"]'),q3=el.querySelector('[data-s="r3"]');if(q2)q2.value=S.set.r2;if(q3)q3.value=S.set.r3}save()};
[].forEach.call(el.querySelectorAll('[data-s]'),function(i){i.oninput=function(){ap(this)};i.onchange=function(){ap(this)}});
document.getElementById('ah').onclick=function(){var m=document.getElementById('hm').value,p=parseH(document.getElementById('hv').value),e=parseFloat(document.getElementById('he').value.replace(',','.'))||0;if(m&&(p||e)){S.hist[m]={p:p,e:e,f:parseFloat(document.getElementById('hf').value.replace(',','.'))||0};save();render()}};[].forEach.call(el.querySelectorAll('[data-me]'),function(i){i.onchange=function(){S.me[this.dataset.me]=this.value.trim()||S.me[this.dataset.me];save()}});var sx=document.getElementById('sx');sx.value=S.set.exo||'both';sx.onchange=function(){S.set.exo=this.value;save()};
[].forEach.call(el.querySelectorAll('[data-dh]'),function(b){b.onclick=function(){delete S.hist[b.dataset.dh];save();render()}})}
var T2=[['jour','<span class="ic">📅</span>Jour'],['semaine','<span class="ic">🗓️</span>Semaines'],['mois','<span class="ic">💶</span>Mois'],['reglages','<span class="ic">⚙️</span>Réglages']];
document.getElementById('nav').innerHTML=T2.map(function(t){return'<a href="#" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</a>'}).join('');
[].forEach.call(document.querySelectorAll('nav a'),function(a){a.onclick=function(e){e.preventDefault();tab=a.dataset.t;render()}});
}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
