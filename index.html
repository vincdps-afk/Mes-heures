<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6df6">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes heures – Van Haecke</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#151a26;--mu:#7b8496;--ac:#2f6df6;--ac2:#6f93ff;--bd:#edf0f6;--sh:0 8px 28px rgba(30,45,90,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f6;--mu:#8b94a5;--ac:#5f86ff;--ac2:#8aa5ff;--bd:#232933;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px;-webkit-font-smoothing:antialiased}
main{padding:22px 18px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 2px 18px}
h2,.lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);font-weight:600;margin:0 0 10px}
h3{font-size:14px;margin:16px 0 6px}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
input,select{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--ac)}
button{padding:15px;font-size:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;width:100%;margin-top:18px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.mu,.sub{color:var(--mu);font-size:13px}
.sub{font-size:14px;margin-top:2px}
