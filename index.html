<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d6fd8">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mes heures – Van Haecke</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#1d6fd8;--bd:#dde1e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2328;--tx:#eef0f3;--mu:#98a2b3;--ac:#5aa2ff;--bd:#2d343b}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2328;--tx:#eef0f3;--mu:#98a2b3;--ac:#5aa2ff;--bd:#2d343b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
main{padding:14px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px;color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{padding:12px;font-size:16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:12px}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:14px 4px;font-size:14px;color:var(--mu)}
nav a.on{color:var(--ac);font-weight:700}
.x{color:#d92d20;float:right;cursor:pointer}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var D={r1:12.43,r2:15.538,r3:18.645,t1:152,t2:185,mf:16.36,me:19.3,pd:8.87,nf:35.95,ne:42.42,ded:5};
var S={days:{},set:Object.assign({},D),hist:{}};
try{var s=JSON.parse(localStorage.getItem('vh')||'null');if(s){S.days=s.days||{};S.set=Object.assign({},D,s.set||{});S.hist=s.hist||{}}}catch(e){}
for(var h0 in S.hist){if(typeof S.hist[h0]==='number')S.hist[h0]={c:0,p:S.hist[h0],e:0}}
function save(){try{localStorage.setItem('vh',JSON.stringify(S))}catch(e){}}
var tab='jour',sel=iso(new Date());
function iso(d){var m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function parseH(v){v=String(v).trim().toLowerCase().replace(',','.');var m=v.match(/^(\d+)\s*[h:]\s*(\d*)$/);if(m)return +m[1]+(+m[2]||0)/60;var n=parseFloat(v);return isNaN(n)?0:n}
function fh(h){var t=Math.round(h*60),m=t%60;return Math.floor(t/60)+'h'+(m<10?'0':'')+m}
function eur(x){return x.toFixed(2).replace('.',',')+' €'}
function allow(d){var c=S.set,t=0;if(d.m==='fr')t+=c.mf;if(d.m==='et')t+=c.me;if(d.m2==='fr')t+=c.mf;if(d.m2==='et')t+=c.me;if(d.p)t+=c.pd;if(d.n==='fr')t+=c.nf;if(d.n==='et')t+=c.ne;return t}
function monday(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function tiers(H){var c=S.set,a=Math.min(H,c.t1),b=Math.max(0,Math.min(H,c.t2)-c.t1),e=Math.max(0,H-c.t2);return{a:a,b:b,e:e,pay:a*c.r1+b*c.r2+e*c.r3}}
function month(key){var h=0,al=0,n=0;for(var k in S.days){if(k.slice(0,7)===key){h+=S.days[k].h||0;al+=allow(S.days[k]);n++}}return{h:h,al:al,n:n}}
function avgRet(){var ks=Object.keys(S.hist).filter(function(k){return S.hist[k].c&&S.hist[k].p}),n=ks.length,t=0;ks.forEach(function(k){t+=S.hist[k].c-S.hist[k].p});return n?Math.round(t/n*100)/100:0}
function histSummary(){var ks=Object.keys(S.hist).filter(function(k){return S.hist[k].p&&S.hist[k].e}),rp=0,re=0,r=avgRet();ks.forEach(function(k){rp+=S.hist[k].p;re+=S.hist[k].e});var o='';if(r)o+='<div class="mu" style="margin-top:8px">Retenue moyenne constatée : <b>'+fh(r)+'</b> par mois</div><button class="s" id="ar">Utiliser '+fh(r)+' comme retenue</button>';if(rp)o+='<div class="mu" style="margin-top:8px">Montant moyen reçu par heure payée : <b>'+eur(re/rp)+'</b></div>';return o}
function dayPay(k){var key=k.slice(0,7),b=0,u=0;for(var x in S.days){if(x.slice(0,7)===key){if(x<k)b+=S.days[x].h;if(x<=k)u+=S.days[x].h}}return tiers(u).pay-tiers(b).pay}
function weekdays(y,m,upto){var c=0,n=new Date(y,m+1,0).getDate();for(var i=1;i<=n;i++){if(upto&&i>upto)break;var w=new Date(y,m,i).getDay();if(w>0&&w<6)c++}return c}
function V(h){return h.n?h.n:''}
function render(){
var el=document.getElementById('app'),h='';
if(tab==='jour'){
var d=S.days[sel]||{h:0,m:'0',p:false,n:'0'};
h+='<h1>Journée</h1><div class="card"><label>Date</label><input type="date" id="dt" value="'+sel+'">'+
'<label>Heures travaillées (ex. 9h30, 9:30 ou 9.5)</label><input id="hh" inputmode="text" value="'+(d.h?fh(d.h):'')+'" placeholder="0h00">'+
'<div class="g2"><div><label>Repas midi</label><select id="mm"><option value="0">Aucun</option><option value="fr">France</option><option value="et">Étranger</option></select></div><div><label>Repas soir</label><select id="m2"><option value="0">Aucun</option><option value="fr">France</option><option value="et">Étranger</option></select></div></div><div class="g2">'+
'<div><label>Nuit</label><select id="nn"><option value="0">Aucune</option><option value="fr">France</option><option value="et">Étranger</option></select></div></div>'+
'<label><input type="checkbox" id="pp" style="width:auto;margin-right:8px"'+(d.p?' checked':'')+'>Petit-déjeuner</label>'+
'<button id="sv">Enregistrer la journée</button></div>';
var ws=monday(pd(sel)),tot=0,al=0,wp=0,rows='';
for(var i=0;i<7;i++){var x=new Date(ws);x.setDate(x.getDate()+i);var k=iso(x),dd=S.days[k];if(dd){tot+=dd.h;al+=allow(dd);wp+=dayPay(k)}
rows+='<div class="row"><span>'+['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'][i]+' '+x.getDate()+'</span><span>'+(dd?fh(dd.h)+' · '+eur(dayPay(k))+' · '+eur(allow(dd)):'—')+(dd?' <span class="x" data-del="'+k+'">✕</span>':'')+'</span></div>'}
var Mo=month(sel.slice(0,7)),mp=tiers(Math.max(0,Mo.h-S.set.ded)).pay,dp=S.days[sel]?dayPay(sel):0,r=function(l,a,b){return'<div class="row"><span>'+l+'</span><span style="text-align:right"><b>'+eur(a+b)+'</b><div class="mu">'+eur(a)+' heures + '+eur(b)+' indemn.</div></span></div>'};
h+='<div class="card"><h2>Totaux</h2>'+r('Jour',dp,allow(d))+r('Semaine',wp,al)+r('Mois (après retenue)',mp,Mo.al)+'<div class="mu" style="margin-top:6px">Jour et semaine : heures calculées avant la retenue de '+S.set.ded+'h du mois.</div></div>';
h+='<div class="card"><h2>Semaine du '+ws.getDate()+'/'+(ws.getMonth()+1)+'</h2><div class="big">'+fh(tot)+'</div><div class="mu">'+eur(wp)+' d’heures · '+eur(al)+' d’indemnités</div><div style="margin-top:8px">'+rows+'</div></div>';
}
if(tab==='semaine'){
var W={};for(var k in S.days){var m=iso(monday(pd(k)));W[m]=W[m]||{h:0,a:0,p:0};W[m].h+=S.days[k].h;W[m].a+=allow(S.days[k]);W[m].p+=dayPay(k)}
var ks=Object.keys(W).sort(),cu={},cm={};ks.forEach(function(k){var mk=k.slice(0,7);cm[mk]=(cm[mk]||0)+W[k].p+W[k].a;cu[k]=cm[mk]});ks.reverse();
h+='<h1>Semaines</h1><div class="card">'+(ks.length?ks.map(function(k){var x=pd(k);return'<div class="row"><span>Sem. du '+x.getDate()+'/'+(x.getMonth()+1)+'<div class="mu">'+fh(W[k].h)+' effectuées</div></span><span style="text-align:right"><b>'+eur(W[k].p+W[k].a)+'</b><div class="mu">'+eur(W[k].p)+' heures + '+eur(W[k].a)+' frais</div><div class="mu">Cumul du mois : '+eur(cu[k])+'</div></span></div>'}).join(''):'<div class="mu">Aucune journée enregistrée.</div>')+'<div class="mu" style="margin-top:6px">Heures valorisées avant la retenue du mois.</div></div>';
}
if(tab==='mois'){
var now=new Date(),key=iso(now).slice(0,7),M=month(key),H=Math.max(0,M.h-S.set.ded),T=tiers(H);
var el2=weekdays(now.getFullYear(),now.getMonth(),now.getDate()),tt=weekdays(now.getFullYear(),now.getMonth()),pr=el2?M.h/el2*tt:0,Hp=Math.max(0,pr-S.set.ded),Tp=tiers(Hp);
var hk=Object.keys(S.hist),av=hk.length?hk.reduce(function(s,k){return s+S.hist[k].p},0)/hk.length:0;
h+='<h1>Mois en cours</h1><div class="card"><h2>Cumul à ce jour (−'+S.set.ded+'h retirées)</h2><div class="big">'+fh(H)+'</div><div class="mu">Saisi : '+fh(M.h)+' sur '+M.n+' jours</div>'+
'<div class="row"><span>Jusqu’à '+S.set.t1+'h</span><span>'+fh(T.a)+' · '+eur(T.a*S.set.r1)+'</span></div>'+
'<div class="row"><span>'+S.set.t1+'h–'+S.set.t2+'h</span><span>'+fh(T.b)+' · '+eur(T.b*S.set.r2)+'</span></div>'+
'<div class="row"><span>Au-delà de '+S.set.t2+'h</span><span>'+fh(T.e)+' · '+eur(T.e*S.set.r3)+'</span></div>'+
'<div class="row"><span>Indemnités</span><span>'+eur(M.al)+'</span></div>'+
'<div class="row"><b>Total à ce jour</b><b>'+eur(T.pay+M.al)+'</b></div></div>'+
'<div class="card"><h2>Estimation fin de mois</h2><div class="big">'+eur(Tp.pay+(el2?M.al/el2*tt:0))+'</div><div class="mu">≈ '+fh(Hp)+' payées. Projection selon ton rythme (jours ouvrés), indemnités incluses.</div>'+
(av?'<div class="mu" style="margin-top:6px">Moyenne de tes mois précédents : '+fh(av)+' ≈ '+eur(tiers(av).pay)+' (hors indemnités)</div>':'')+'</div>';
}
if(tab==='reglages'){
var c=S.set,f=function(k,l){return'<label>'+l+'</label><input data-s="'+k+'" inputmode="decimal" value="'+c[k]+'">'};
h+='<h1>Réglages</h1><div class="card"><h2>Taux horaires</h2><div class="g2">'+f('r1','Tarif de base €/h')+f('r2','Tarif 2 €/h')+f('r3','Tarif 3 €/h')+f('t1','Seuil 1 (h)')+f('t2','Seuil 2 (h)')+f('ded','Heures retirées / mois (3 à 8)')+'</div></div>'+
'<div class="card"><h2>Indemnités (€)</h2><div class="g2">'+f('mf','Repas France')+f('me','Repas étranger')+f('pd','Petit-déj')+f('nf','Nuit France')+f('ne','Nuit étranger')+'</div></div>'+
'<div class="card"><h2>Mois précédents (fiches de paie)</h2><label>Mois</label><input type="month" id="hm"><label>Heures que j’ai comptées (ex. 165h30)</label><input id="hc" placeholder="0h00"><label>Heures payées par ma patronne</label><input id="hv" placeholder="0h00"><label>Montant reçu (€)</label><input id="he" inputmode="decimal" placeholder="0,00"><button class="s" id="ah">Ajouter ce mois</button><div style="margin-top:8px">'+
Object.keys(S.hist).sort().reverse().map(function(k){var x=S.hist[k];return'<div class="row"><span>'+k+'</span><span style="text-align:right"><b>'+eur(x.e)+'</b><div class="mu">comptées '+fh(x.c)+' · payées '+fh(x.p)+'</div><div class="mu">retenue '+fh(Math.max(0,x.c-x.p))+' <span class="x" data-dh="'+k+'">✕</span></div></span></div>'}).join('')+histSummary()+'</div></div>';
}
el.innerHTML=h;
if(tab==='jour'){document.getElementById('mm').value=d.m||'0';document.getElementById('m2').value=d.m2||'0';document.getElementById('nn').value=d.n||'0';
document.getElementById('dt').onchange=function(){sel=this.value||sel;render()};
document.getElementById('sv').onclick=function(){S.days[sel]={h:parseH(document.getElementById('hh').value),m:document.getElementById('mm').value,m2:document.getElementById('m2').value,n:document.getElementById('nn').value,p:document.getElementById('pp').checked};save();render()};
[].forEach.call(el.querySelectorAll('[data-del]'),function(b){b.onclick=function(){delete S.days[b.dataset.del];save();render()}})}
if(tab==='reglages'){[].forEach.call(el.querySelectorAll('[data-s]'),function(i){i.onchange=function(){var v=parseFloat(this.value.replace(',','.'));if(!isNaN(v)){S.set[this.dataset.s]=v;save()}}});
document.getElementById('ah').onclick=function(){var m=document.getElementById('hm').value,c=parseH(document.getElementById('hc').value),p=parseH(document.getElementById('hv').value),e=parseFloat(document.getElementById('he').value.replace(',','.'))||0;if(m&&(p||c||e)){S.hist[m]={c:c,p:p,e:e};save();render()}};var ar=document.getElementById('ar');if(ar)ar.onclick=function(){S.set.ded=avgRet();save();render()};
[].forEach.call(el.querySelectorAll('[data-dh]'),function(b){b.onclick=function(){delete S.hist[b.dataset.dh];save();render()}})}
var T2=[['jour','Jour'],['semaine','Semaines'],['mois','Mois'],['reglages','Réglages']];
document.getElementById('nav').innerHTML=T2.map(function(t){return'<a href="#" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</a>'}).join('');
[].forEach.call(document.querySelectorAll('nav a'),function(a){a.onclick=function(e){e.preventDefault();tab=a.dataset.t;render()}});
}
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
